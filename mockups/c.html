<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup C — Desk of papers</title>
<style>
:root{
  --felt:#4E5442; --felt2:#444A39; --frame:#2B2620; --wood:#7E5C3B; --wood2:#6A4B2F; --paper:#F1EAD6; --paper2:#E6DCC1;
  --ink:#2A241C; --stampR:#B8392E; --stampB:#2F5D8A; --olive:#6E7A3C; --brass:#C9A55A;
  --serif:"Caladea",Cambria,"Iowan Old Style",Georgia,"DejaVu Serif",serif;
  --type:"Courier 10 Pitch","Courier New","Liberation Mono",Courier,monospace;
  --jp:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP","IPAPGothic","IPAGothic",serif;
  --jps:"Hiragino Sans","Noto Sans JP","Yu Gothic","IPAPGothic","IPAGothic",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--frame);color:var(--ink);font-family:var(--jps);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
.app{height:100vh;display:grid;grid-template-rows:34px 236px 1fr;overflow:hidden}

.top{display:flex;align-items:center;gap:14px;padding:0 14px;background:var(--frame);color:#D9CFB6;font-size:13px}
.top b{font-family:var(--serif);font-size:16px}
.parts{display:flex;gap:10px}.parts span{color:#7D7462}.parts span.on{color:#F1EAD6;border-bottom:2px solid var(--stampR)}
.top .sp{flex:1}
.coins{font-family:var(--serif);font-size:17px;font-weight:700;color:#F1EAD6;display:flex;align-items:center;gap:6px}
.menu{color:#D9CFB6;font-size:18px;width:30px}

/* the window onto the customer */
.win{position:relative;margin:0 14px;border:10px solid var(--frame);border-bottom:0;background:linear-gradient(#9DB0B0,#C4CEC2 70%,#AEB6A4);overflow:hidden;display:grid;grid-template-columns:330px 1fr;align-items:end}
.win::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 220px,rgba(43,38,32,.07) 220px 228px)}
.win svg.cap{position:relative;width:300px;height:226px;justify-self:center;display:block}
.speech{position:relative;align-self:center;margin:0 22px 18px 0;background:var(--paper);border:2px solid var(--ink);padding:14px 20px 16px;box-shadow:4px 4px 0 rgba(42,36,28,.35)}
.speech::before{content:"";position:absolute;left:-14px;bottom:26px;border:12px solid transparent;border-right-color:var(--ink);border-left:0}
.speech::after{content:"";position:absolute;left:-10px;bottom:28px;border:10px solid transparent;border-right-color:var(--paper);border-left:0}
.speech .nm{font-family:var(--serif);font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#6B5B44}
.speech p{margin:2px 0 0;font-family:var(--serif);font-size:24px;line-height:1.7}
.sill{position:absolute;left:0;right:0;bottom:0;height:12px;background:#3A332A}

.w{position:relative;cursor:pointer;border-bottom:1px dotted rgba(42,36,28,.45)}
.w:hover{background:rgba(201,165,90,.35)}
.w .gl{position:absolute;left:50%;top:100%;transform:translateX(-50%);font-family:var(--jps);font-size:11px;line-height:1;color:var(--stampB);white-space:nowrap}
.w .gl:empty{display:none}

/* desk */
.desk{position:relative;margin:0 14px;border:10px solid var(--frame);border-top:14px solid #3A332A;background:radial-gradient(120% 90% at 50% 30%,var(--felt),var(--felt2));display:grid;
  grid-template-columns:262px 1fr 300px;grid-template-areas:"drawers papers tray";gap:16px;padding:14px;min-height:0}
.drawers{grid-area:drawers;display:grid;grid-template-rows:repeat(8,1fr);gap:5px;background:var(--wood2);padding:7px;border-radius:4px;box-shadow:0 6px 0 rgba(0,0,0,.25);min-height:0}
.drw{display:grid;grid-template-columns:58px 1fr auto;align-items:center;gap:8px;background:linear-gradient(var(--wood),#735335);border:2px solid #4E3720;border-radius:3px;padding:3px 8px 3px 4px;min-height:0;transition:transform .1s}
.drw .gw{height:100%;max-height:52px;background:#1E1A14;border:2px solid var(--brass);border-radius:2px;overflow:hidden}
.drw .gw svg{width:100%;height:100%;display:block}
.drw .lb{background:var(--paper);border:1px solid #9B8660;padding:2px 5px;font-family:var(--serif);font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:2px}
.drw .ct{font-family:var(--type);font-size:22px;font-weight:700;color:#FFF3D6;min-width:26px;text-align:right}
.drw.zero{background:linear-gradient(#5E4630,#56402B)}
.drw.zero .lb{background:var(--paper2);color:#8A7B62}
.drw.zero .ct{color:#F2A08E}
.drw:active{transform:translateX(4px)}

.papers{grid-area:papers;position:relative;min-width:0;min-height:0}
.ticket{position:absolute;left:6px;top:0;width:min(58%,340px);background:#FFFBEF;padding:14px 16px 18px;transform:rotate(-2deg);box-shadow:3px 6px 0 rgba(0,0,0,.25);font-family:var(--type);font-size:16px;line-height:1.5;z-index:2;cursor:zoom-in;
  background-image:linear-gradient(transparent 0 30px,#E7B9AE 30px 31px,transparent 31px);}
.ticket .no{font-size:12px;color:#8A7B62;display:flex;justify-content:space-between;margin-bottom:10px}
.ticket .to{font-weight:700;font-size:17px;margin-bottom:6px}
.ticket ul{margin:0;padding-left:18px}
.ticket li{margin:2px 0}
.ticket .pin{position:absolute;top:-8px;left:50%;width:16px;height:16px;border-radius:50%;background:var(--stampR);box-shadow:0 2px 0 rgba(0,0,0,.4)}
.ticket.close{position:fixed;left:50%;top:50%;width:min(420px,90vw);transform:translate(-50%,-50%) rotate(-1deg);font-size:22px;z-index:30;cursor:zoom-out;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.book{position:absolute;right:0;bottom:4px;left:0;height:min(58%,290px);background:#5B2A22;border-radius:6px;padding:8px;display:flex;transform:rotate(1.5deg);box-shadow:4px 8px 0 rgba(0,0,0,.28);z-index:1;cursor:pointer}
.book .pg{flex:1;background:var(--paper);padding:22px 20px 14px;font-family:var(--serif);font-size:17px;line-height:1.6;overflow:hidden;position:relative}
.book .pg:first-child{box-shadow:inset -14px 0 16px -12px rgba(0,0,0,.35)}
.book .pg+.pg{box-shadow:inset 14px 0 16px -12px rgba(0,0,0,.35)}
.book h4{margin:0 0 4px;font-size:18px;font-style:italic;border-bottom:1px solid #C8B994;padding-bottom:3px}
.book p{margin:0 0 14px}
.book .folio{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-size:12px;color:#8A7B62}
.book .cover{display:none}
.padobj{position:absolute;right:14px;top:10px;width:96px;height:112px;background:#EDE5CC;border-top:14px solid #3D5A6E;border-radius:3px;box-shadow:2px 4px 0 rgba(0,0,0,.3);transform:rotate(-4deg);font-size:12px;font-weight:700;color:#3D5A6E;padding-top:8px;text-align:center;z-index:0;
  background-image:repeating-linear-gradient(transparent 0 13px,#C9C0A4 13px 14px)}

.tray{grid-area:tray;display:grid;grid-template-rows:auto 1fr auto;gap:10px;min-height:0}
.stamps{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;background:#3A332A;padding:8px;border-radius:4px}
.stamp{grid-column:span 3;height:44px;border-radius:4px;color:#FFF5E3;font-family:var(--jp);font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 rgba(0,0,0,.4);border:2px solid rgba(0,0,0,.25)}
.stamp.m{grid-column:span 2;background:var(--olive)}
.stamp[data-temp=hot]{background:var(--stampR)}
.stamp[data-temp=cold]{background:var(--stampB)}
.stamp.on{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.4);outline:3px solid #F1EAD6;outline-offset:-6px}
.board{position:relative;background:linear-gradient(#8E6A45,#7A5838);border:3px solid #4E3720;border-radius:10px;box-shadow:0 6px 0 rgba(0,0,0,.3);display:grid;grid-template-columns:.9fr 1.1fr;align-items:center;gap:6px;padding:10px;min-height:0}
.board svg{width:100%;height:100%;max-height:200px;min-height:0}
.card{background:var(--paper);padding:8px 10px;font-family:var(--type);font-size:13.5px;line-height:1.4;transform:rotate(2deg);box-shadow:2px 3px 0 rgba(0,0,0,.25);position:relative;min-height:120px;align-self:center}
.card .h{font-family:var(--jps);font-size:11px;color:#8A7B62;margin-bottom:4px}
.card .ink{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:4px 6px;margin-top:8px}
.card .ink span{font-family:var(--jp);font-weight:700;font-size:15px;border:2.5px solid currentColor;padding:0 6px;border-radius:3px;transform:rotate(-8deg);opacity:.85}
.card .ink .r{color:var(--stampR)}.card .ink .b{color:var(--stampB)}.card .ink .o{color:var(--olive)}
.card .empty{color:#A89A7E}
.trayacts{display:grid;grid-template-columns:auto 1fr;gap:8px}
.reset{height:54px;padding:0 14px;border-radius:4px;background:#3A332A;color:#D9CFB6;font-size:14px;font-weight:700}
.serve{height:54px;border-radius:4px;background:var(--paper);color:var(--ink);font-family:var(--jp);font-size:22px;font-weight:800;letter-spacing:.2em;border:3px solid var(--ink);box-shadow:0 5px 0 rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;gap:10px}
.serve::before{content:"";width:0;height:0;border:9px solid transparent;border-bottom:13px solid var(--ink);border-top:0}
.serve.next{font-size:17px;letter-spacing:.06em}.serve.next::before{display:none}
.serve:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.4)}
.bump{animation:bump .25s}@keyframes bump{40%{transform:scale(1.05)}}
.shake{animation:shake .3s}@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

.gcard{position:fixed;z-index:50;background:var(--paper);border:2px solid var(--ink);padding:12px;box-shadow:5px 5px 0 rgba(0,0,0,.35)}
.gc-word{font-family:var(--serif);font-size:24px;font-weight:700;font-style:italic}
.gc-lab{display:block;font-size:12px;color:#6B5B44;margin:4px 0 4px}
.gc-in{width:100%;font:16px var(--jps);padding:6px 8px;border:0;border-bottom:2px solid var(--ink);background:transparent}
.gc-btns{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}
.gc-btns button{padding:5px 12px;border:2px solid var(--ink);font-weight:700;font-size:14px}
.gc-save{background:var(--ink);color:var(--paper)}
.bookov,.pad-ov{position:fixed;inset:0;z-index:40;background:rgba(20,16,10,.6);display:flex;align-items:center;justify-content:center;padding:14px}
.bigbook{display:flex;flex-wrap:wrap;width:min(880px,100%);max-height:100%;overflow:auto;background:#5B2A22;border-radius:8px;padding:10px}
.bigbook .pg{flex:1 1 300px;background:var(--paper);padding:20px 24px;font-family:var(--serif);font-size:19px;line-height:1.7}
.bigbook h4{margin:0 0 4px;font-style:italic;font-size:21px;border-bottom:1px solid #C8B994}
.bigbook p{margin:0 0 16px}
.pad{background:#EDE5CC;border-top:16px solid #3D5A6E;padding:12px 16px;width:min(480px,100%);max-height:100%;overflow:auto;font-size:14px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.pad-h{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:17px;margin-bottom:6px}
.pad-x{font-size:22px;width:30px;height:30px}
.pad-t{width:100%;border-collapse:collapse;font-family:var(--type)}
.pad-t th{font:600 11px var(--jps);color:#6B5B44;text-align:left}
.pad-t td{padding:2px 4px;border-bottom:1px solid #C9C0A4}
.pad-st{white-space:nowrap}.pad-st button{width:26px;height:26px;border:1px solid var(--ink)}.pad-st b{display:inline-block;width:24px;text-align:center}
.pad-f{display:flex;gap:14px;align-items:center;justify-content:flex-end;margin-top:10px}
.pad-go{background:var(--ink);color:var(--paper);padding:7px 16px;font-weight:700}.pad-go:disabled{opacity:.3}

@media (max-width:640px){
  .app{grid-template-rows:32px 178px 1fr}
  .top{gap:8px;padding:0 8px;font-size:12px}
  .parts{gap:6px}
  .win{margin:0 6px;border-width:6px;grid-template-columns:118px 1fr}
  .win svg.cap{width:150px;height:160px;justify-self:start;margin-left:-16px}
  .speech{margin:8px 8px 14px 4px;padding:8px 10px 10px;align-self:center}
  .speech .nm{font-size:11px}
  .speech p{font-size:16px;line-height:1.6}
  .desk{margin:0 6px 6px;border-width:6px;border-top-width:10px;padding:8px;gap:8px;
    grid-template-columns:1fr 1fr;grid-template-rows:auto auto 1fr auto;grid-template-areas:"papers papers" "drawers drawers" "tray tray" "tray tray"}
  .papers{height:150px}
  .ticket{width:60%;font-size:12.5px;padding:7px 9px 8px;line-height:1.4;top:8px;left:2px}
  .ticket li{margin:0}
  .ticket .no{margin-bottom:4px;font-size:10px}
  .ticket .to{font-size:14px;margin-bottom:2px}
  .book{left:auto;width:36%;height:126px;right:2px;top:10px;bottom:auto;padding:6px;transform:rotate(2deg)}
  .book .pg{display:none}
  .book .cover{display:flex;flex:1;align-items:center;justify-content:center;flex-direction:column;border:2px solid var(--brass);color:#F1D9A0;font-family:var(--jp);font-weight:700;font-size:15px;gap:4px}
  .book .cover small{font-family:var(--serif);font-style:italic;font-size:12px;color:#D9B98A}
  .padobj{display:none}
  .drawers{grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,64px);gap:4px;padding:5px}
  .drw{position:relative;grid-template-columns:1fr;grid-template-rows:1fr auto;gap:2px;padding:2px 3px 3px}
  .drw .ct{position:absolute;right:3px;top:2px;background:rgba(30,26,20,.85);border-radius:0 0 0 6px;padding:0 5px;line-height:1.25}
  .drw .gw{max-height:none;height:100%}
  .drw .lb.long{font-size:9.4px;letter-spacing:-.05em}
  .drw .lb{font-size:10.5px;padding:0 2px;letter-spacing:-.03em;text-overflow:clip;text-align:center}
  .drw .ct{font-size:16px;min-width:0}
  .tray{grid-template-rows:auto 1fr auto;gap:7px}
  .stamps{padding:6px;gap:5px}
  .stamp{height:38px;font-size:14px}
  .board{padding:6px;grid-template-columns:1fr 1fr}
  .board svg{max-height:170px}
  .card{font-size:12.5px;min-height:96px}
  .card .ink span{font-size:12px}
  .reset{height:48px;font-size:13px}
  .serve{height:48px;font-size:19px}
  .tray .padmini{display:flex}
}
.padmini{display:none;height:48px;padding:0 10px;align-items:center;background:#EDE5CC;border-top:8px solid #3D5A6E;font-size:12px;font-weight:700;color:#3D5A6E;border-radius:3px}
@media (max-width:640px){ .trayacts{grid-template-columns:auto auto 1fr} }
</style>
</head>
<body>
<div class="app">
  <header class="top"><b>3日目</b><div class="parts"><span>始業前</span><span class="on">業務中</span><span>業務後</span></div><div class="sp"></div>
    <div class="coins"><svg width="18" height="18" viewBox="0 0 18 18"><circle cx="9" cy="9" r="8" fill="#C9A55A" stroke="#7A5E22" stroke-width="1.5"/><rect x="6.5" y="6.5" width="5" height="5" fill="#7A5E22"/></svg>46</div><button class="menu" aria-label="メニュー">≡</button></header>
  <section class="win">
    <svg class="cap" id="cap" viewBox="20 40 260 260" preserveAspectRatio="xMidYMax meet"></svg>
    <div class="speech"><div class="nm">Captain Reed</div><p id="say"></p></div>
    <div class="sill"></div>
  </section>
  <section class="desk">
    <div class="drawers" id="drawers"></div>
    <div class="papers">
      <div class="ticket" id="ticket" data-act="ticket"></div>
      <div class="book" data-act="book"><div class="pg" id="pg1"></div><div class="pg" id="pg2"></div><div class="cover">レシピ帳<small>Recipes</small></div></div>
      <button class="padobj" data-act="pad">注文書</button>
    </div>
    <div class="tray">
      <div class="stamps">
        <button class="stamp" data-temp="hot">ホット</button><button class="stamp" data-temp="cold">アイス</button>
        <button class="stamp m" data-method="boil">煮る</button><button class="stamp m" data-method="steep">蒸らす</button><button class="stamp m" data-method="stir">混ぜる</button>
      </div>
      <div class="board" id="board"><svg id="cup" viewBox="-110 -110 220 220"></svg><div class="card" id="card"></div></div>
      <div class="trayacts"><button class="padmini" data-act="pad">注文書</button><button class="reset" data-act="reset">戻す</button><button class="serve" data-act="serve" id="serve">出す</button></div>
    </div>
  </section>
</div>
<script>
/* shared mock core: state, drawings of the goods, tappable words, guess card, order pad */
const ORDER = ['lemon','ginger','mint','honey','chrysanthemum','red date','green tea','sugar'];
const START = {lemon:3, ginger:6, mint:0, honey:5, chrysanthemum:4, 'red date':2, 'green tea':7, sugar:9};
const PRICE = {lemon:4, ginger:3, mint:3, honey:6, chrysanthemum:5, 'red date':4, 'green tea':5, sugar:2};
const S = {stock:{...START}, cup:[], temp:'hot', method:null, served:false, reply:'', gloss:{}};
const LINE = "I can't sleep, so I want chrysanthemum and red date tea. Not too sweet, please.";
const WHO = 'Captain Reed';
const RECIPES = [
  {t:'Chrysanthemum and Red Date', b:'One chrysanthemum, two red dates. Steep in hot water. For a sweet cup, add honey.'},
  {t:'Lemon and Ginger', b:'One lemon, one ginger. Boil it. Honey if they like it sweet.'},
  {t:'Mint Cooler', b:'Two mint, one green tea. Stir with cold water.'},
  {t:'Green Tea', b:'One green tea. Steep it, hot or cold.'}
];
const METHODS = [['boil','煮る'],['steep','蒸らす'],['stir','混ぜる']];

function piece(k, x, y, s=1, r=0){
  const t = `transform="translate(${x} ${y}) rotate(${r}) scale(${s})"`;
  switch(k){
    case 'lemon': return `<g ${t}><ellipse rx="13" ry="9.5" fill="#F3D03E" stroke="#A88414" stroke-width="1.6"/><ellipse cx="-13" rx="2.6" ry="2.2" fill="#D8B21E"/><ellipse cx="13" rx="2.6" ry="2.2" fill="#D8B21E"/><ellipse cx="-4" cy="-3.6" rx="5.5" ry="2" fill="#FFF6B8" opacity=".85"/></g>`;
    case 'ginger': return `<g ${t}><path d="M-15 3C-15-4-7-7-3-2C-1-10 8-11 9-4C16-4 17 5 10 7C4 10-11 11-15 3Z" fill="#DDB277" stroke="#94693A" stroke-width="1.6"/><path d="M-7 2Q0 0 6 3M2-3l1 3" stroke="#B5864F" fill="none" stroke-width="1.3"/></g>`;
    case 'mint': return `<g ${t}><path d="M0 2C-13-2-15-13-5-16C1-12 3-5 0 2Z" fill="#62B86E" stroke="#2C7339" stroke-width="1.4"/><path d="M0 2C13 0 17-11 8-15C1-11-1-5 0 2Z" fill="#4DA25B" stroke="#2C7339" stroke-width="1.4"/><path d="M0 2V9" stroke="#2C7339" stroke-width="2.2" stroke-linecap="round"/></g>`;
    case 'honey': return `<g ${t}><path d="M0-14C6-6 11 0 11 5A11 11 0 0 1-11 5C-11 0-6-6 0-14Z" fill="#E7A41C" stroke="#9A6306" stroke-width="1.6"/><ellipse cx="-4" cy="3" rx="2.6" ry="4.2" fill="#FFD77A" opacity=".85"/></g>`;
    case 'chrysanthemum': {
      let p=''; for(let i=0;i<14;i++){ p+=`<ellipse rx="3.2" ry="8.5" cy="-7" fill="#FBEFB0" stroke="#C9A94A" stroke-width=".9" transform="rotate(${i*360/14})"/>`; }
      return `<g ${t}>${p}<circle r="5.5" fill="#E9B52A" stroke="#A97E12" stroke-width="1.2"/></g>`;
    }
    case 'red date': return `<g ${t}><ellipse rx="11.5" ry="8.5" fill="#962A23" stroke="#4E120E" stroke-width="1.6"/><path d="M-7-2Q0 1 7-3M-6 3Q1 5 7 2" stroke="#661915" fill="none" stroke-width="1.2"/><ellipse cx="-4" cy="-4.5" rx="3.4" ry="1.6" fill="#DA7266" opacity=".75"/></g>`;
    case 'green tea': return `<g ${t}><path d="M-12 4C-11-8 6-12 12-3C6-6-2-2-3 7Z" fill="#6F8F33" stroke="#3B5416" stroke-width="1.5"/><path d="M-2 8C3 1 10 1 13 6C8 5 3 7 1 11Z" fill="#5E7D2A" stroke="#3B5416" stroke-width="1.3"/></g>`;
    case 'sugar': return `<g ${t}><path d="M0-10L10-5L0 0L-10-5Z" fill="#FFFFFF" stroke="#9AA0A6" stroke-width="1.2"/><path d="M-10-5L0 0V11L-10 6Z" fill="#E6E8EA" stroke="#9AA0A6" stroke-width="1.2"/><path d="M10-5L0 0V11L10 6Z" fill="#CFD3D7" stroke="#9AA0A6" stroke-width="1.2"/></g>`;
  }
  return '';
}
const SLOTS = [[50,50,0],[28,30,-20],[72,30,25],[28,70,15],[72,70,-30],[50,24,10],[50,78,-10],[18,50,40],[82,50,-40]];
function binPieces(k, n, s=1.15){
  let out=''; for(let i=0;i<Math.min(n,9);i++){ const [x,y,r]=SLOTS[i]; out+=piece(k,x,y,s,r); } return out;
}
function icon(k, size=40){ return `<svg viewBox="-18 -18 36 36" width="${size}" height="${size}" aria-hidden="true">${piece(k,0,0,1,0)}</svg>`; }
const TINT = {chrysanthemum:[236,176,48],'red date':[200,92,40],'green tea':[150,176,84],lemon:[236,214,96],ginger:[214,166,98],honey:[216,152,42],mint:[140,200,138]};
function liquidColor(){
  let c=[214,230,234], w=S.cup.length?0.6:1;
  let r=c[0]*w,g=c[1]*w,b=c[2]*w,t=w;
  S.cup.forEach(k=>{ const x=TINT[k]; if(x){ r+=x[0];g+=x[1];b+=x[2];t+=1; } });
  r/=t; g/=t; b/=t;
  if(S.temp==='cold'){ r=(r+235)/2; g=(g+240)/2; b=(b+242)/2; }
  return `rgb(${r|0},${g|0},${b|0})`;
}
/* pieces floating in a round cup seen from above, centre 0,0 radius R */
function cupPieces(R, s=1){
  const out=[]; const n=S.cup.length;
  S.cup.forEach((k,i)=>{
    const a = i*2.39996; const d = R*0.62*Math.sqrt((i+0.6)/Math.max(n,4));
    out.push(piece(k, Math.cos(a)*d, Math.sin(a)*d, s, (i*47)%360));
  });
  if(S.temp==='cold'){ [[-.35,-.3],[.3,.25],[.1,-.45]].forEach(([x,y],i)=>out.push(`<rect x="${x*R-9}" y="${y*R-9}" width="18" height="18" rx="4" fill="#EAF6FB" opacity=".85" stroke="#B9D9E6" transform="rotate(${i*25} ${x*R} ${y*R})"/>`)); }
  return out.join('');
}
function cupSummary(){ const m={}; S.cup.forEach(k=>m[k]=(m[k]||0)+1); return ORDER.filter(k=>m[k]).map(k=>[k,m[k]]); }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function words(text){
  return text.replace(/[A-Za-z][A-Za-z']*|[^A-Za-z]+/g, tok=>{
    if(!/^[A-Za-z]/.test(tok)) return esc(tok);
    const key=tok.toLowerCase(); const g=S.gloss[key];
    return `<span class="w" data-w="${esc(key)}">${esc(tok)}<small class="gl">${g?esc(g):''}</small></span>`;
  });
}
function addIng(k){
  if(S.served) return false;
  if(S.stock[k]<=0) return false;
  S.stock[k]--; S.cup.push(k); return true;
}
function resetCup(){ if(S.served) return; S.cup.forEach(k=>S.stock[k]++); S.cup=[]; S.method=null; }
function serve(){
  if(S.served) return;
  const has=k=>S.cup.includes(k);
  const sweet=S.cup.filter(k=>k==='honey'||k==='sugar').length;
  let r;
  if(!S.cup.length) r="Just hot water? Well. It's warm, I suppose.";
  else if(has('chrysanthemum')&&has('red date')&&!sweet) r="Mm. Flowers and dates. My mother made this on the boat. Thank you.";
  else if(has('chrysanthemum')&&has('red date')) r="Oh, that's sweet. Sweeter than I like, but it's warm. Thanks.";
  else r="Hm. Not what I had in mind. I'll drink it anyway.";
  if(S.temp==='cold' && S.cup.length) r="Cold, at night? "+r;
  S.reply=r; S.mood = /Thank you\.$/.test(r)&&S.temp==='hot' ? 'smile' : 'flat';
  S.served=true;
}
function nextCustomer(){ S.cup=[]; S.method=null; S.temp='hot'; S.served=false; S.reply=''; S.mood=null; }

/* guess card: the player writes their own meaning; no translation anywhere */
let gcard;
function openCard(el){
  closeCard();
  const key=el.dataset.w;
  gcard=document.createElement('div'); gcard.className='gcard';
  gcard.innerHTML=`<div class="gc-word">${esc(key)}</div><label class="gc-lab">自分の意味</label><input class="gc-in" maxlength="30" value="${esc(S.gloss[key]||'')}" placeholder="ここに書く"><div class="gc-btns"><button class="gc-close" type="button">閉じる</button><button class="gc-save" type="button">書く</button></div>`;
  document.body.appendChild(gcard);
  const r=el.getBoundingClientRect(), W=Math.min(260, innerWidth-24);
  gcard.style.width=W+'px';
  let left=Math.max(12, Math.min(innerWidth-W-12, r.left+r.width/2-W/2));
  gcard.style.left=left+'px';
  const h=gcard.offsetHeight;
  let top=r.bottom+10; if(top+h>innerHeight-8) top=Math.max(8, r.top-h-10);
  gcard.style.top=top+'px';
  const inp=gcard.querySelector('input');
  const save=()=>{ const v=inp.value.trim(); if(v) S.gloss[key]=v; else delete S.gloss[key]; document.querySelectorAll(`.w[data-w="${CSS.escape(key)}"] .gl`).forEach(g=>g.textContent=v); closeCard(); };
  gcard.querySelector('.gc-save').onclick=save;
  gcard.querySelector('.gc-close').onclick=closeCard;
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter') save(); if(e.key==='Escape') closeCard(); });
  setTimeout(()=>inp.focus({preventScroll:true}),0);
}
function closeCard(){ if(gcard){ gcard.remove(); gcard=null; } }
document.addEventListener('click',e=>{
  const w=e.target.closest('.w'); if(w){ e.stopPropagation(); openCard(w); return; }
  if(gcard && !e.target.closest('.gcard')) closeCard();
}, true);

/* order pad: opened only by the player; nothing ticked */
function openPad(){
  const q={}; ORDER.forEach(k=>q[k]=0);
  const ov=document.createElement('div'); ov.className='pad-ov';
  const draw=()=>{
    const sub=ORDER.reduce((a,k)=>a+q[k]*PRICE[k],0); const fee= sub===0?0: sub<20?6:3;
    ov.innerHTML=`<div class="pad"><div class="pad-h">注文書<button class="pad-x" type="button" aria-label="閉じる">×</button></div>
    <table class="pad-t"><thead><tr><th></th><th>品</th><th>単価</th><th>棚</th><th>数</th></tr></thead><tbody>${ORDER.map(k=>`<tr><td>${icon(k,26)}</td><td class="pad-n">${k}</td><td>${PRICE[k]}</td><td>${S.stock[k]}</td><td class="pad-st"><button type="button" data-k="${k}" data-d="-1">−</button><b>${q[k]}</b><button type="button" data-k="${k}" data-d="1">+</button></td></tr>`).join('')}</tbody></table>
    <div class="pad-f"><span>配達料 ${fee}</span><span>合計 ${sub+fee}</span><button class="pad-go" type="button" ${sub?'':'disabled'}>注文する</button></div></div>`;
    ov.querySelector('.pad-x').onclick=()=>ov.remove();
    ov.querySelectorAll('.pad-st button').forEach(b=>b.onclick=()=>{ const k=b.dataset.k; q[k]=Math.max(0,q[k]+(+b.dataset.d)); draw(); });
    ov.querySelector('.pad-go').onclick=()=>ov.remove();
  };
  ov.addEventListener('click',e=>{ if(e.target===ov) ov.remove(); });
  draw(); document.body.appendChild(ov);
}
function bump(el){ if(!el) return; el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }

/* Captain Reed: original drawing, palette per mockup. viewBox 0 0 300 330 */
function captain(p, mood){
  const o = p.line ? `stroke="${p.line}" stroke-width="${p.lw||3}" stroke-linejoin="round"` : '';
  const mouth = mood==='smile' ? `<path d="M131 196Q150 210 169 196" fill="none" stroke="${p.ink}" stroke-width="4" stroke-linecap="round"/>`
             : `<path d="M134 199Q150 196 166 199" fill="none" stroke="${p.ink}" stroke-width="4" stroke-linecap="round"/>`;
  const eyes = mood==='smile'
    ? `<path d="M114 150Q124 142 134 150M166 150Q176 142 186 150" fill="none" stroke="${p.ink}" stroke-width="4.5" stroke-linecap="round"/>`
    : `<ellipse cx="124" cy="151" rx="6" ry="5" fill="${p.ink}"/><ellipse cx="176" cy="151" rx="6" ry="5" fill="${p.ink}"/>
       <path d="M113 146Q124 141 135 146M165 146Q176 141 187 146" fill="none" stroke="${p.ink}" stroke-width="3.5" stroke-linecap="round"/>
       <path d="M115 161Q124 166 133 161M167 161Q176 166 185 161" fill="none" stroke="${p.skinD}" stroke-width="3" stroke-linecap="round"/>`;
  return `
  <path d="M18 330C22 268 64 240 110 230H190C236 240 278 268 282 330Z" fill="${p.coat}" ${o}/>
  <path d="M110 230L150 318L190 230H172L150 280L128 230Z" fill="${p.coatD}" ${o}/>
  <circle cx="98" cy="292" r="6" fill="${p.gold}"/><circle cx="202" cy="292" r="6" fill="${p.gold}"/>
  <rect x="130" y="196" width="40" height="40" fill="${p.skinD}"/>
  <path d="M108 224C126 246 174 246 192 224L196 244C176 264 124 264 104 244Z" fill="${p.scarf}" ${o}/>
  <path d="M168 248l14 40-18 4-8-38Z" fill="${p.scarf}" ${o}/>
  <path d="M92 150C88 196 98 214 116 222L120 150Z" fill="${p.hair}" ${o}/>
  <path d="M208 150C212 196 202 214 184 222L180 150Z" fill="${p.hair}" ${o}/>
  <ellipse cx="96" cy="160" rx="9" ry="14" fill="${p.skinD}" ${o}/><ellipse cx="204" cy="160" rx="9" ry="14" fill="${p.skinD}" ${o}/>
  <ellipse cx="150" cy="158" rx="55" ry="64" fill="${p.skin}" ${o}/>
  <path d="M97 128C98 140 102 150 108 156L112 126Z" fill="${p.hair}"/><path d="M203 128C202 140 198 150 192 156L188 126Z" fill="${p.hair}"/>
  ${eyes}
  <path d="M146 158Q141 178 150 182Q156 182 158 178" fill="none" stroke="${p.skinD}" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M110 178Q113 186 118 188M190 178Q187 186 182 188" fill="none" stroke="${p.skinD}" stroke-width="2.5" stroke-linecap="round"/>
  ${mouth}
  <path d="M78 96C78 66 222 66 222 96L212 108H88Z" fill="${p.cap}" ${o}/>
  <rect x="88" y="96" width="124" height="26" rx="6" fill="${p.band}" ${o}/>
  <path d="M94 120C116 138 184 138 206 120L204 130C184 150 116 150 96 130Z" fill="${p.peak}" ${o}/>
  <path d="M138 104h24l-4 12h-16Z" fill="${p.gold}"/>
  <path d="M100 99h100" stroke="${p.gold}" stroke-width="2.5" opacity=".9"/>`;
}

const PAL={coat:'#3E4A5A',coatD:'#2E3846',scarf:'#9C4A3A',skin:'#C9A083',skinD:'#9C735A',hair:'#BFC0BA',cap:'#E4E2D8',band:'#2C3440',peak:'#1E2228',gold:'#C9A55A',ink:'#2A241C',line:'#2A241C',lw:2.5};
function render(){
  document.getElementById('say').innerHTML = words(S.served ? S.reply : LINE);
  document.getElementById('cap').innerHTML = captain(PAL,S.mood);
  document.getElementById('drawers').innerHTML = ORDER.map(k=>{
    const n=S.stock[k];
    return `<button class="drw ${n?'':'zero'}" data-ing="${k}" aria-label="${k} ${n}"><span class="gw"><svg viewBox="0 10 100 80" preserveAspectRatio="xMidYMid meet">${binPieces(k,n,1.3)}</svg></span><span class="lb ${k.length>10?'long':''}">${k}</span><span class="ct">${n}</span></button>`;
  }).join('');
  document.getElementById('ticket').innerHTML = `<span class="pin"></span><div class="no"><span>No. 3-07</span><span>席 2</span></div><div class="to">${words('Captain Reed')}</div><ul><li>${words('chrysanthemum and red date')}</li><li>${words('not too sweet')}</li><li>${words("can't sleep")}</li></ul>`;
  document.getElementById('pg1').innerHTML = `<h4>${words(RECIPES[0].t)}</h4><p>${words(RECIPES[0].b)}</p><h4>${words(RECIPES[3].t)}</h4><p>${words(RECIPES[3].b)}</p><div class="folio">12</div>`;
  document.getElementById('pg2').innerHTML = `<h4>${words(RECIPES[1].t)}</h4><p>${words(RECIPES[1].b)}</p><h4>${words(RECIPES[2].t)}</h4><p>${words(RECIPES[2].b)}</p><div class="folio">13</div>`;
  const R=74, hot=S.temp==='hot';
  document.getElementById('cup').innerHTML = `
    <circle r="104" fill="#EDE6D3" stroke="#2A241C" stroke-width="3"/>
    <path d="M80 -24C114 -26 114 26 80 24" fill="none" stroke="#2A241C" stroke-width="18" stroke-linecap="round"/><path d="M80 -24C114 -26 114 26 80 24" fill="none" stroke="#F8F4EA" stroke-width="10" stroke-linecap="round"/>
    <circle r="86" fill="#F8F4EA" stroke="#2A241C" stroke-width="3"/>
    <circle r="${R}" fill="${liquidColor()}"/>${cupPieces(R,1.5)}`;
  const sum=cupSummary(); const m=METHODS.find(x=>x[0]===S.method);
  document.getElementById('card').innerHTML = `<div class="h">カップの中</div>${sum.length?sum.map(([k,c])=>`<div>${k} ×${c}</div>`).join(''):'<div class="empty">—</div>'}<div class="ink"><span class="${hot?'r':'b'}">${hot?'ホット':'アイス'}</span>${m?`<span class="o">${m[1]}</span>`:''}</div>`;
  document.querySelectorAll('[data-temp]').forEach(b=>b.classList.toggle('on', b.dataset.temp===S.temp));
  document.querySelectorAll('[data-method]').forEach(b=>b.classList.toggle('on', b.dataset.method===S.method));
  const sv=document.getElementById('serve'); sv.textContent=S.served?'次のお客さん':'出す'; sv.classList.toggle('next',S.served); sv.dataset.act=S.served?'next':'serve';
}
function openBook(){
  const ov=document.createElement('div'); ov.className='bookov';
  ov.innerHTML=`<div class="bigbook"><div class="pg">${RECIPES.slice(0,2).map(r=>`<h4>${words(r.t)}</h4><p>${words(r.b)}</p>`).join('')}</div><div class="pg">${RECIPES.slice(2).map(r=>`<h4>${words(r.t)}</h4><p>${words(r.b)}</p>`).join('')}</div></div>`;
  ov.addEventListener('click',e=>{ if(!e.target.closest('.w')) ov.remove(); });
  document.body.appendChild(ov);
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-ing],[data-temp],[data-method],[data-act]'); if(!t) return;
  if(t.dataset.ing){ if(addIng(t.dataset.ing)){ render(); bump(document.getElementById('board')); } else { t.classList.remove('shake'); void t.offsetWidth; t.classList.add('shake'); } return; }
  if(S.served && !t.dataset.act) return;
  if(t.dataset.temp){ S.temp=t.dataset.temp; render(); return; }
  if(t.dataset.method){ S.method = S.method===t.dataset.method?null:t.dataset.method; render(); return; }
  const a=t.dataset.act;
  if(a==='serve'){ serve(); render(); }
  else if(a==='next'){ nextCustomer(); render(); }
  else if(a==='reset'){ resetCup(); render(); }
  else if(a==='book') openBook();
  else if(a==='ticket') t.classList.toggle('close');
  else if(a==='pad') openPad();
});
render();
</script>
</body>
